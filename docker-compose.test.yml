x-bun-base: &bun-base
  image: oven/bun:latest
  working_dir: /app
  profiles: [integration]
  volumes: [.:/app]
  environment: &bun-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-marketplace_ci}
    BETTER_AUTH_URL: http://localhost:3001

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_ci}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace_ci}"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  migrate:
    <<: *bun-base
    depends_on:
      db: {condition: service_healthy}
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        cd apps/api &&
        bunx drizzle-kit migrate &&
        bun run src/db/seed.ts
      "

  integration-tests:
    <<: *bun-base
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *bun-env
      CI: "true"
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        cd apps/api &&
        bun test
      "

volumes:
  postgres_test_data:
