# Serves the TanStack Start SPA. The nginx-unprivileged image runs as a
# non-root user and binds :8080. SPA mode emits a prerendered shell at
# /_shell.html (not index.html); all unknown paths fall back to it so
# client-side routing (TanStack Router) works on deep links / refresh.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Long-cache fingerprinted assets; never fall back to the shell for these.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # "/" must serve the shell explicitly — the base image ships an index.html
    # that would otherwise shadow it via the default index directive.
    location = / {
        try_files /_shell.html =404;
    }

    # Real static files (favicon, manifest, robots) are served directly when
    # present; everything else falls back to the SPA shell.
    location / {
        try_files $uri /_shell.html;
    }
}
