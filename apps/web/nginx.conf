# Serves the TanStack Start SPA. The nginx-unprivileged image runs as a
# non-root user and binds :8080. All unknown paths fall back to index.html
# so client-side routing (TanStack Router) works on deep links / refresh.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
