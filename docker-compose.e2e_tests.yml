services:
  db:
    image: postgres:17-alpine
    env_file: [.env.pipeline]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1'",
        ]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-oven/bun:latest}
    working_dir: /app
    profiles:
      - e2e
    env_file: [.env.pipeline]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun run -e "try { const r = await fetch(''http://localhost:3001/''); process.exit(r.ok ? 0 : 1); } catch { process.exit(1); }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        cd apps/api &&
        bunx drizzle-kit migrate &&
        bun run src/db/seed.ts &&
        HOST=0.0.0.0 bun run --watch src/index.ts
      "
    expose:
      - '3001'

  web:
    image: ${WEB_IMAGE:-oven/bun:latest}
    working_dir: /app
    profiles:
      - e2e
    env_file: [.env.pipeline]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun run -e "try { const r = await fetch(''http://localhost:3000/''); process.exit(r.ok ? 0 : 1); } catch { process.exit(1); }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        cd apps/web &&
        bun run dev --host 0.0.0.0 --port 3000
      "
    expose:
      - '3000'

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    profiles:
      - e2e
    environment:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: http://web:3000
      PLAYWRIGHT_API_URL: http://api:3001
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update -qq && apt-get install -qq -y unzip curl > /dev/null 2>&1 &&
        curl -fsSL https://bun.sh/install | bash &&
        export PATH=\"$$HOME/.bun/bin:$$PATH\" &&
        bun install --frozen-lockfile &&
        echo '--- Diagnostics ---' &&
        curl -s -o /dev/null -w 'web status: %{http_code}\n' http://web:3000/ &&
        curl -s -o /dev/null -w 'api status: %{http_code}\n' http://api:3001/ &&
        curl -s -o /dev/null -w 'api/auth status: %{http_code}\n' http://api:3001/api/auth/get-session &&
        curl -s -o /dev/null -w 'api/categories status: %{http_code}\n' http://api:3001/categories &&
        echo '--- End Diagnostics ---' &&
        npx playwright test --workers=1
      "

volumes:
  postgres_e2e_data:
