stages:
  - install
  - lint
  - unit & integration tests
  - e2e tests
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  BUN_INSTALL_CACHE_DIR: /tmp/bun-cache

  # --- Deployment (build + deploy stages) ---
  HARBOR_URL: cerit.io/v_gibas
  API_IMAGE: cerit.io/v_gibas/marketplace-api
  WEB_IMAGE: cerit.io/v_gibas/marketplace-web
  K8S_NAMESPACE: gibas-ns
  HELM_RELEASE_NAME: marketplace
  HELM_CHART_PATH: ./charts/marketplace
  WEB_HOST: marketplace.dyn.cloud.e-infra.cz
  API_HOST: marketplace-api.dyn.cloud.e-infra.cz
  STORAGE_HOST: marketplace-storage.dyn.cloud.e-infra.cz

default:
  image: oven/bun:latest

.bun-cache: &bun-cache
  key:
    files:
      - bun.lock
      - package.json
  paths:
    - node_modules/
    - apps/api/node_modules/
    - apps/web/node_modules/
    - /tmp/bun-cache

install:
  stage: install
  tags:
    - shared-fi
  cache:
    <<: *bun-cache
  script:
    - bun install --frozen-lockfile

eslint:
  stage: lint
  tags:
    - shared-fi
  needs:
    - job: install
      optional: false
  cache:
    <<: *bun-cache
    policy: pull
  script:
    - bun install --frozen-lockfile
    - bun run lint

prettier:
  stage: lint
  tags:
    - shared-fi
  needs:
    - job: install
      optional: false
  cache:
    <<: *bun-cache
    policy: pull
  script:
    - bun install --frozen-lockfile
    - bun run format:check

frontend-unit-tests:
  stage: unit & integration tests
  tags:
    - shared-fi
  needs:
    - job: install
      optional: false
  cache:
    <<: *bun-cache
    policy: pull
  script:
    - bun install --frozen-lockfile
    - cd apps/web && bun --env-file=../../.env.pipeline run test

backend-integration-tests:
  stage: unit & integration tests
  image: docker:cli
  tags:
    - shared-fi
  timeout: 15m
  needs:
    - job: install
      optional: false
  services:
    - docker:24-dind-rootless
  variables:
    DOCKER_HOST: 'unix:///runner/services/docker/docker.sock'
  before_script:
    - apk add --no-cache curl
  script:
    - docker compose --env-file .env.pipeline -f docker-compose.unit_integration_tests.yml --profile integration up --build --exit-code-from integration-tests
  artifacts:
    when: always
    paths:
      - apps/api/coverage/
    expire_in: 30 minutes

e2e-tests:
  stage: e2e tests
  image: docker:cli
  tags:
    - shared-fi
  needs:
    - job: install
      optional: false
  services:
    - docker:24-dind-rootless
  variables:
    DOCKER_HOST: 'unix:///runner/services/docker/docker.sock'
    CI: 'true'
    PLAYWRIGHT_BASE_URL: 'http://web:3000'
  before_script:
    - apk add --no-cache curl
  script:
    - docker compose --env-file .env.pipeline -f docker-compose.e2e_tests.yml --profile e2e up --build --exit-code-from playwright
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 60 minutes
  rules:
    - when: manual

# ===========================================================================
# Deployment — only on `master` or `deployment`.
# Chained off `install` via `needs` (DAG), so lint / tests / prettier never
# gate a deploy. Builds two images with Kaniko, then deploys the Helm chart.
# ===========================================================================
.deploy-rules: &deploy-rules
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "deployment"'

.kaniko: &kaniko
  stage: build
  tags:
    - shared-fi
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: ['']
  # Only "rely on install" — not on lint / tests / prettier.
  needs:
    - job: install
      optional: false
  <<: *deploy-rules
  before_script:
    - echo "{\"auths\":{\"${HARBOR_URL}\":{\"auth\":\"$(printf "%s:%s" "${HUB_REGISTRY_USER}" "${HARBOR_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

build_api:
  <<: *kaniko
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/apps/api/Dockerfile"
      --destination "${API_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${API_IMAGE}:latest"

build_web:
  <<: *kaniko
  script:
    # VITE_* are inlined at build time, so the API URL is baked in here.
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/apps/web/Dockerfile"
      --build-arg "VITE_API_URL=https://${API_HOST}"
      --build-arg "VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}"
      --destination "${WEB_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${WEB_IMAGE}:latest"

deploy:
  stage: deploy
  tags:
    - shared-fi
  image:
    name: alpine/helm:3.16.4
    entrypoint: ['']
  needs:
    - job: build_api
      optional: false
    - job: build_web
      optional: false
  <<: *deploy-rules
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    # KUBECONFIG may be a File-type variable (a path) or a normal variable
    # (the kubeconfig content). Handle both, then point KUBECONFIG at the result.
    - mkdir -p ~/.kube
    - if [ -f "$KUBECONFIG" ]; then cp "$KUBECONFIG" ~/.kube/config; else printf '%s' "$KUBECONFIG" > ~/.kube/config; fi
    - export KUBECONFIG=~/.kube/config
  script:
    - helm upgrade --install ${HELM_RELEASE_NAME} ${HELM_CHART_PATH}
      --namespace ${K8S_NAMESPACE}
      --set api.image.repository=${API_IMAGE}
      --set api.image.tag=${CI_COMMIT_SHORT_SHA}
      --set web.image.repository=${WEB_IMAGE}
      --set web.image.tag=${CI_COMMIT_SHORT_SHA}
      --set ingress.web.host=${WEB_HOST}
      --set ingress.api.host=${API_HOST}
      --set ingress.minio.host=${STORAGE_HOST}
      --wait
      --timeout 5m
  environment:
    name: production
    url: https://${WEB_HOST}
