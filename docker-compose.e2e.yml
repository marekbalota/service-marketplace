services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_ci}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace_ci}"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data

  migrate:
    image: ${API_IMAGE:-oven/bun:latest}
    working_dir: /app
    profiles:
      - e2e
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-marketplace_ci}
      BETTER_AUTH_URL: http://localhost:3001
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        cd apps/api &&
        bunx drizzle-kit migrate &&
        bun run src/db/seed.ts
      "

  api:
    image: ${API_IMAGE:-oven/bun:latest}
    working_dir: /app
    profiles:
      - e2e
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-marketplace_ci}
      BETTER_AUTH_URL: http://api:3001
    healthcheck:
      test: ["CMD-SHELL", "bun run -e \"try { const r = await fetch('http://localhost:3001/'); process.exit(r.ok ? 0 : 1); } catch { process.exit(1); }\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        cd apps/api &&
        HOST=0.0.0.0 bun run --watch src/index.ts
      "
    expose:
      - "3001"

  web:
    image: ${WEB_IMAGE:-oven/bun:latest}
    working_dir: /app
    profiles:
      - e2e
    environment:
      VITE_API_URL: http://api:3001
      BETTER_AUTH_URL: http://api:3001
    healthcheck:
      test: ["CMD-SHELL", "bun run -e \"try { const r = await fetch('http://localhost:3000/'); process.exit(r.ok ? 0 : 1); } catch { process.exit(1); }\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c "
        bun install --frozen-lockfile &&
        cd apps/web &&
        bun run dev -- --host
      "
    expose:
      - "3000"

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    profiles:
      - e2e
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://web:3000
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    command: >
      sh -c "
        apt-get update -qq && apt-get install -qq -y unzip curl > /dev/null 2>&1 &&
        curl -fsSL https://bun.sh/install | bash &&
        export PATH=\"$$HOME/.bun/bin:$$PATH\" &&
        bun install --frozen-lockfile &&
        npx playwright test --workers=1
      "

volumes:
  postgres_e2e_data:
