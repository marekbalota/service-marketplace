apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marketplace.api.fullname" . }}
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "marketplace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "marketplace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: SEED_ON_START
              value: {{ .Values.api.seedOnStart | quote }}
            # DATABASE_URL is taken straight from the CloudNativePG-generated app secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "marketplace.db.fullname" . }}-app
                  key: uri
            - name: FRONTEND_URL
              value: "https://{{ .Values.ingress.web.host }}"
            - name: BETTER_AUTH_URL
              value: "https://{{ .Values.ingress.api.host }}"
            # In-cluster service endpoints
            - name: REDIS_HOST
              value: {{ include "marketplace.redis.fullname" . }}
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_ENDPOINT
              value: {{ include "marketplace.minio.fullname" . }}
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: MINIO_PUBLIC_URL
              value: "https://{{ .Values.ingress.minio.host }}"
          # Remaining secrets: BETTER_AUTH_SECRET, TURNSTILE_SECRET_KEY,
          # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, SMTP_*, EMAIL_FROM
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketplace.api.fullname" . }}
  labels:
    {{- include "marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "marketplace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
